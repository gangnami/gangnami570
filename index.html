<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --coral:#FF5B35;
    --coral-deep:#E8451F;
    --navy:#1E3350;
    --navy-soft:#3A5372;
    --cream:#FFF7EF;
    --card:#FFFFFF;
    --line:#EFE3D6;
    --text:#2A2320;
    --text-dim:#8C7F73;
    --green:#2F9E68;
    --green-bg:#EAF7EF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--cream);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 20px;}

  .header{
    background:linear-gradient(160deg, var(--navy) 0%, #16283F 100%);
    padding:34px 20px 46px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:160px;height:160px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,91,53,0.35), transparent 70%);
  }
  .brand-row{display:flex;align-items:baseline;gap:8px;position:relative;z-index:1;}
  .brand{font-size:36px;font-weight:800;letter-spacing:-0.5px;}
  .brand-badge{
    display:inline-block;font-size:13px;font-weight:700;
    background:var(--coral);color:#fff;padding:4px 10px;border-radius:20px;
    letter-spacing:0.5px;
  }
  .sub{margin-top:10px;font-size:17px;color:#C6D0DB;font-weight:600;position:relative;z-index:1;}
  .period-chip{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:16px;background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    padding:10px 16px;border-radius:14px;font-size:15px;color:#EDE7DD;
    position:relative;z-index:1;
  }

  .content{margin-top:-24px;position:relative;z-index:2;}

  .card{
    background:var(--card);
    border-radius:20px;
    padding:26px 22px;
    margin-bottom:18px;
    box-shadow:0 6px 20px rgba(30,20,10,0.06);
    border:1px solid var(--line);
  }
  .field-label{
    font-size:19px;font-weight:800;margin-bottom:12px;color:var(--navy);
    display:flex;align-items:center;gap:10px;
  }
  .field-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:50%;
    background:var(--coral);color:#fff;font-size:14px;font-weight:800;flex:none;
  }
  .field-help{font-size:14.5px;color:var(--text-dim);margin:-4px 0 14px 38px;line-height:1.55;}
  .field-help.strong{color:#B8541F;font-weight:700;}

  input[type=text], input[type=number]{
    width:100%;
    font-family:'Pretendard',sans-serif;
    font-size:23px;font-weight:700;
    padding:19px 18px;
    border-radius:16px;
    border:2px solid var(--line);
    background:#FFFCF9;
    color:var(--text);
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--coral);}
  .input-with-unit{position:relative;}
  .input-with-unit input{padding-right:52px;}
  .unit{
    position:absolute;right:18px;top:50%;transform:translateY(-50%);
    font-size:17px;font-weight:700;color:var(--text-dim);
  }

  .cta{
    width:100%;padding:22px 0;border:none;border-radius:18px;
    background:var(--coral);color:#fff;font-size:20px;font-weight:800;
    margin-top:6px;cursor:pointer;letter-spacing:-0.3px;
    box-shadow:0 8px 20px rgba(255,91,53,0.35);
  }
  .cta:active{transform:scale(0.98);}
  .cta.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none;}

  .hero-result{
    background:linear-gradient(150deg, var(--coral) 0%, var(--coral-deep) 100%);
    border-radius:22px;padding:30px 24px;color:#fff;margin-bottom:18px;
    box-shadow:0 10px 26px rgba(232,69,31,0.3);
  }
  .hero-result .label{font-size:16px;opacity:0.9;font-weight:700;}
  .hero-result .amount{font-size:44px;font-weight:800;margin-top:8px;letter-spacing:-1px;}
  .hero-result .name{font-size:14.5px;margin-top:12px;opacity:0.9;}

  .section-title{
    font-size:17px;font-weight:800;color:var(--navy-soft);
    margin:24px 0 12px 4px;
    display:flex;align-items:center;gap:6px;
  }

  .award-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:19px 20px;margin-bottom:12px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .award-card.dim{opacity:0.55;}
  .award-title{font-size:17px;font-weight:700;color:var(--text);}
  .award-desc{font-size:14px;color:var(--text-dim);margin-top:4px;line-height:1.45;}
  .award-amount{font-size:21px;font-weight:800;color:var(--coral-deep);white-space:nowrap;}
  .award-amount.zero{color:var(--text-dim);font-size:15px;font-weight:600;}

  .goal-box{
    background:var(--green-bg);border-radius:16px;padding:16px 18px;
    font-size:15px;color:#1F6D45;line-height:1.65;margin-top:8px;
    display:flex;gap:8px;
  }
  .goal-box b{color:#155C36;}

  .note{
    margin-top:26px;padding:18px;border-radius:16px;
    background:#FDF2E9;border:1px solid #F3DCC3;
    font-size:14px;color:#8A5A28;line-height:1.65;
  }

  .footer-space{height:10px;}
  .hidden{display:none;}
</style>
</head>
<body>

<div class="header">
  <div class="wrap">
    <div class="brand-row">
      <span class="brand">강나미</span>
      <span class="brand-badge">GANGNAM</span>
    </div>
    <div class="sub">강남지역단 9월 2주차 시상 가이드</div>
    <div class="period-chip">📅 2차 (9/7~11, 5영업일) 기준</div>
  </div>
</div>

<div class="wrap content">

  <!-- ===== 입력 화면 ===== -->
  <div id="formScreen">

    <div class="card">
      <div class="field-label"><span class="field-num">1</span>이름</div>
      <input type="text" id="inpName" placeholder="예) 김강남">
    </div>

    <div class="card">
      <div class="field-label"><span class="field-num">2</span>이번 주 인보험 실적</div>
      <div class="field-help">2차 (9/7~11) 기준 실적을 입력하세요 · 명절맞이 인보험 대박 선물시상 기준</div>
      <div class="input-with-unit">
        <input type="number" inputmode="numeric" id="inpWeekly" placeholder="예) 380000">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="card">
      <div class="field-label"><span class="field-num">3</span>하이캡 누적 실적</div>
      <div class="field-help strong">⚠️ 위 인보험 실적과는 전혀 다른 별도 지표입니다. 하이캡 누적 값을 입력하세요 (9/7~9 3영업일 한정 특별시상)</div>
      <div class="input-with-unit">
        <input type="number" inputmode="numeric" id="inpHighcap" placeholder="예) 2000000">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="card">
      <div class="field-label"><span class="field-num">4</span>이번 달(9/1~30) 누계 인보험 실적</div>
      <div class="field-help">윤단장이 쏜다! 시즌3 경품 기준</div>
      <div class="input-with-unit">
        <input type="number" inputmode="numeric" id="inpCumulMonth" placeholder="예) 620000">
        <span class="unit">원</span>
      </div>
    </div>

    <button class="cta" onclick="showResult()">결과 확인하기 →</button>
  </div>

  <!-- ===== 결과 화면 ===== -->
  <div id="resultScreen" class="hidden">

    <div class="hero-result">
      <div class="label">예상 총 시상금 (현금·쿠폰 기준)</div>
      <div class="amount" id="totalAmount">0원</div>
      <div class="name" id="resultName"></div>
    </div>

    <div class="section-title">💰 항목별 시상 내역</div>
    <div id="awardList"></div>

    <div class="section-title">🎯 다음 목표까지</div>
    <div id="goalList"></div>

    <div class="note" id="specialNote"></div>

    <div class="footer-space"></div>
    <button class="cta ghost" onclick="showForm()">← 다시 입력하기</button>
  </div>

</div>

<script>
/* =========================================================
   1. 계산 로직 (CALC) — 규칙이 바뀌면 이 객체만 교체하면 됩니다.
   ========================================================= */
const CALC = {

  // 명절맞이 인보험 대박 선물 시상 (100%) — 2차 9/7~11, 5영업일
  // 현금 또는 물품(1세트당 10만원 상당) 교차선택 가능 — 여기서는 이해하기 쉽게 "현금 환산 금액"만 보여줌
  daebak: {
    tiers: [
      { min: 1000000, amount: null, baseIsPrincipal: true }, // 100만원↑: 실적금액의 100% (현금 기준)
      { min: 700000,  amount: 700000 },
      { min: 500000,  amount: 500000 },
      { min: 400000,  amount: 400000 },
      { min: 300000,  amount: 300000 },
      { min: 200000,  amount: 200000 },
      { min: 100000,  amount: 100000 },
      { min: 50000,   amount: 50000  },
    ],
    thresholds: [50000,100000,200000,300000,400000,500000,700000,1000000],

    calc(amount) {
      const tier = this.tiers.find(t => amount >= t.min);
      if (!tier) return 0;
      return tier.baseIsPrincipal ? amount : tier.amount;
    },
    nextGoal(amount) {
      const next = this.thresholds.find(t => t > amount);
      if (!next) return null;
      return { gap: next - amount, label: (next/10000)+'만원' };
    }
  },

  // 명절맞이 인보험 하이캡 특별시상 (3일 限, 2차 9/7~9) — 인보험 실적과 무관한 별도 하이캡 누적 지표 기준
  highcapSpecial: {
    tiers: [
      { min: 5100000, count: 5 },
      { min: 3400000, count: 3 },
      { min: 1700000, count: 1 },
    ],
    thresholds: [1700000,3400000,5100000],
    couponUnit: 30000, // 배달의민족 또는 올리브영 쿠폰 1매 = 3만원

    calc(amount) {
      const tier = this.tiers.find(t => amount >= t.min);
      const count = tier ? tier.count : 0;
      return { count, cash: count * this.couponUnit };
    },
    nextGoal(amount) {
      const next = this.thresholds.find(t => t > amount);
      if (!next) return null;
      return { gap: next - amount, label: (next/10000)+'만원' };
    }
  },

  // 윤단장이 쏜다!! 50만 챌린지 시즌3 — 월 누계(9/1~30) 50만원↑ 단일 기준
  // ※ 현재 2차(9/7~11) 시점 = 3주차(9/18) 마감 전이므로, 지금 달성하면 조기달성 보너스(상품권)까지 자동 충족
  challenge50: {
    threshold: 500000,
    prize: '포천 이동양념 소갈비 2KG + 배달의민족 상품권 5만원',
    calc(cumulMonth) { return cumulMonth >= this.threshold; },
    nextGoal(cumulMonth) {
      if (cumulMonth >= this.threshold) return null;
      return { gap: this.threshold - cumulMonth, label: '50만원' };
    }
  }
};

/* =========================================================
   2. UI 로직
   ========================================================= */
function won(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function showForm(){
  document.getElementById('formScreen').classList.remove('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  window.scrollTo(0,0);
}

function showResult(){
  const name = document.getElementById('inpName').value.trim() || '플래너';
  const weekly = Number(document.getElementById('inpWeekly').value) || 0;
  const highcapAmt = Number(document.getElementById('inpHighcap').value) || 0;
  const cumulMonth = Number(document.getElementById('inpCumulMonth').value) || 0;

  // --- 계산 ---
  const db = CALC.daebak.calc(weekly);
  const hc = CALC.highcapSpecial.calc(highcapAmt);
  const won50 = CALC.challenge50.calc(cumulMonth);

  const totalCash = db + hc.cash;

  // --- 총액 ---
  document.getElementById('totalAmount').textContent = won(totalCash);
  document.getElementById('resultName').textContent = `${name}님의 예상 시상 내역`;

  // --- 항목별 카드 ---
  const cards = [];

  cards.push(awardCardHTML({
    title: '명절맞이 인보험 대박 선물시상',
    desc: db > 0 ? '현금 또는 물품(1세트당 10만원 상당)으로 교차선택 가능' : '5만원 이상부터 지급 대상입니다',
    amount: db,
  }));

  cards.push(awardCardHTML({
    title: '명절맞이 인보험 하이캡 특별시상',
    desc: hc.count > 0
      ? `배달의민족 또는 올리브영 쿠폰 3만원 x${hc.count}매 (인보험 실적과 별개의 하이캡 지표 기준)`
      : '하이캡 누적 170만원 이상부터 지급 대상입니다',
    amount: hc.cash,
  }));

  cards.push(awardCardHTML({
    title: '윤단장이 쏜다! 50만 챌린지 시즌3',
    desc: won50 ? `${CALC.challenge50.prize} 지급 대상 (월누적 기준)` : '월누적 50만원 이상부터 대상입니다',
    amount: null,
    badge: won50 ? '소갈비+상품권' : null,
  }));

  document.getElementById('awardList').innerHTML = cards.join('');

  // --- 다음 목표 ---
  const goals = [];
  const g1 = CALC.daebak.nextGoal(weekly);
  if(g1) goals.push(goalHTML(`인보험 대박 선물시상 다음 구간(<b>${g1.label}</b>)까지 <b>${won(g1.gap)}</b> 남았어요.`));

  const g2 = CALC.highcapSpecial.nextGoal(highcapAmt);
  if(g2) goals.push(goalHTML(`하이캡 특별시상 다음 구간(<b>${g2.label}</b>)까지 <b>${won(g2.gap)}</b> 남았어요.`));

  const g3 = CALC.challenge50.nextGoal(cumulMonth);
  if(g3) goals.push(goalHTML(`50만 챌린지 시즌3까지 <b>${won(g3.gap)}</b> 남았어요. (월누적 기준)`));

  document.getElementById('goalList').innerHTML = goals.length ? goals.join('') :
    `<div class="goal-box">🎉 모든 항목에서 최고 구간을 달성하셨어요!</div>`;

  document.getElementById('specialNote').innerHTML =
    `⚠️ 위 금액은 입력 실적 기준 예상치입니다. 실제 지급액은 집금률·유지율 등 관리사항, 본인계약 제외 조건, 시상 한도 등 최종 승인 기준에 따라 달라질 수 있어요. 정확한 금액은 지점을 통해 다시 확인해주세요.`;

  document.getElementById('formScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  window.scrollTo(0,0);
}

function awardCardHTML({title, desc, amount, badge}){
  let right;
  if(badge){
    right = `<div class="award-amount">${badge}</div>`;
  } else if(amount && amount > 0){
    right = `<div class="award-amount">${won(amount)}</div>`;
  } else {
    right = `<div class="award-amount zero">대상 아님</div>`;
  }
  return `
    <div class="award-card ${(!amount && !badge) ? 'dim' : ''}">
      <div>
        <div class="award-title">${title}</div>
        <div class="award-desc">${desc}</div>
      </div>
      ${right}
    </div>`;
}

function goalHTML(text){
  return `<div class="goal-box">📍 ${text}</div>`;
}
</script>
</body>
</html>
